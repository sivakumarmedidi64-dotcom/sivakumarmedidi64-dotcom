<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title id="t">Exam score out of 20, on the same hard questions</title>
  <desc id="d">CodeConClave AI's main brain scored 18 of 20. Six other open models tested the same way scored 17, 16, 16, 16, 13 and 10.</desc>
  <rect width="860" height="440" rx="16" fill="#141414"/>
  <text x="32" y="46" fill="#f4f4f4" font-size="22" font-weight="700">Why this brain: the same exam, the same settings</text>
  <text x="32" y="72" fill="#9a9a9a" font-size="14">10 hard maths and 10 hard coding questions from public test sets. Score out of 20. Tested 9 Nov 2026.</text>
  <g font-size="14">
    <text x="32" y="115" fill="#f4f4f4" font-weight="600">CodeConClave AI main brain</text>
    <rect x="240" y="98" width="522" height="24" rx="5" fill="#f2c200"/><text x="772" y="115" fill="#f2c200" font-weight="700" font-size="16">18</text>
    <text x="32" y="159" fill="#bdbdbd">Open model A</text>
    <rect x="240" y="142" width="493" height="24" rx="5" fill="#5a5a5a"/><text x="743" y="159" fill="#d6d6d6" font-weight="600" font-size="16">17</text>
    <text x="32" y="203" fill="#bdbdbd">Open model B</text>
    <rect x="240" y="186" width="464" height="24" rx="5" fill="#5a5a5a"/><text x="714" y="203" fill="#d6d6d6" font-weight="600" font-size="16">16</text>
    <text x="32" y="247" fill="#bdbdbd">Open model C</text>
    <rect x="240" y="230" width="464" height="24" rx="5" fill="#5a5a5a"/><text x="714" y="247" fill="#d6d6d6" font-weight="600" font-size="16">16</text>
    <text x="32" y="291" fill="#bdbdbd">Open model D</text>
    <rect x="240" y="274" width="464" height="24" rx="5" fill="#5a5a5a"/><text x="714" y="291" fill="#d6d6d6" font-weight="600" font-size="16">16</text>
    <text x="32" y="335" fill="#bdbdbd">Open model E</text>
    <rect x="240" y="318" width="377" height="24" rx="5" fill="#5a5a5a"/><text x="627" y="335" fill="#d6d6d6" font-weight="600" font-size="16">13</text>
    <text x="32" y="379" fill="#bdbdbd">Open model F</text>
    <rect x="240" y="362" width="290" height="24" rx="5" fill="#5a5a5a"/><text x="540" y="379" fill="#d6d6d6" font-weight="600" font-size="16">10</text>
  </g>
  <text x="32" y="418" fill="#7d7d7d" font-size="12.5">A small test: a score can move a point or two between runs. It compares open models we can run, not every AI in the world.</text>
</svg>
